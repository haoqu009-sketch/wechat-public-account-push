# Initial HTTP-only vhost. It does not require a certificate that does not yet exist.
# Enable only this file OR recruitment-reader.https.conf, never both.
server {
    listen 80;
    server_name jobs.ragzhicha.cn;
    root /var/www/recruitment-reader;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 2m;

    # Global no-store also covers both public JSON routes, without losing inherited security headers.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # A dedicated ACME webroot. No redirect/TLS dependency during certificate issuance.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    # Expose only the public latest report and immutable 24-hex snapshots.
    location = /data/public.json {
        alias /var/lib/recruitment-reader/data/public.json;
        default_type application/json;
        limit_except GET HEAD { deny all; }
    }
    location ~ "^/data/([a-f0-9]{24})[.]json$" {
        alias /var/lib/recruitment-reader/data/$1.json;
        default_type application/json;
        limit_except GET HEAD { deny all; }
    }
    location /data/ {
        return 404;
    }

    # The Node receiver authenticates POST. Browsers never receive the sync token.
    location = /api/sync {
        access_log off;
        proxy_pass http://127.0.0.1:8769;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location /api/ {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
