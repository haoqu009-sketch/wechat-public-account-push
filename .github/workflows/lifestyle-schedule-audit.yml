name: lifestyle-schedule-audit

on:
  workflow_dispatch:
  schedule:
    # Bounded read-only comparison: 2026-10-26 08:20–08:55 Beijing.
    # Remove this workflow after the observation window; no production sender here.
    - cron: '20,25,30,35,40,45,50,55 0 26 10 *'

permissions: {}

concurrency:
  group: lifestyle-schedule-audit
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Observe event without credentials, checkout, or WeChat requests
        env:
          OBSERVED_EVENT: ${{ github.event_name }}
          OBSERVED_CRON: ${{ github.event.schedule }}
          OBSERVED_RUN: ${{ github.run_id }}
        run: |
          if [ "$(date -u +%Y-%m-%d)" != "2026-10-26" ]; then
            printf '%s\n' 'SCHEDULE_AUDIT_EXPIRED: no work performed'
            exit 0
          fi
          printf 'SCHEDULE_AUDIT event=%s utc=%s cron=%s run=%s\n' \
            "$OBSERVED_EVENT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$OBSERVED_CRON" "$OBSERVED_RUN"
