name: medical-imaging-recruitment

on:
  push:
    paths:
      - 'recruitment/**'
      - '.github/workflows/qinglong-push.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅采集并生成报告，不发送微信、不改变去重状态'
        type: boolean
        default: true
      test_wechat:
        description: '仅校验新模板、发布采集预览并发送明确标注的测试消息，不标记岗位已发送'
        type: boolean
        default: false
      daily_preview:
        description: '立即按日常样式发送真实采集日报，即使无新增也发送一次，不改变岗位去重记录'
        type: boolean
        default: false
      publish_web_preview:
        description: '仅发布真实采集报告和招聘网页，不发送微信、不改变岗位去重记录'
        type: boolean
        default: false
  schedule:
    # 每天北京时间 07:30；GitHub Actions 定时任务可能延迟。
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: medical-imaging-recruitment
  cancel-in-progress: false

jobs:
  daily-digest:
    # Server ownership disables ALL GitHub publishing/state mutation/sending paths.
    # Only a pure read-only dry run remains available here after migration.
    if: >-
      vars.RECRUITMENT_SENDER_OWNER != 'server' &&
      (github.event_name != 'workflow_dispatch' || (!inputs.test_wechat && !inputs.daily_preview))
    # The read-only hosted comparison reached 4/6 sources on macOS vs 2/6 on Ubuntu.
    # A successful run is not proof of full source coverage; inspect the source report.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      NODE_USE_ENV_PROXY: '1'
      RECRUITMENT_STATE_DIR: ${{ github.workspace }}/.recruitment-state
      # 代码部署自动跑预览；仅定时运行或手动取消dry_run时发送。
      DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish_web_preview) || (github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.dry_run))) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recruitment/package-lock.json
      - name: 安装招聘模块依赖
        run: npm ci --prefix recruitment --no-audit --no-fund
      - name: 验证招聘逻辑
        run: npm test --prefix recruitment
      - name: 恢复持久化去重状态
        run: node recruitment/github-state.mjs restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 采集并生成日报
        run: |
          if [ "$DRY_RUN" = true ]; then
            node recruitment/run.mjs --dry-run
          else
            node recruitment/run.mjs --collect-only
          fi
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
      - name: 发布日报详情
        id: publish
        if: env.DRY_RUN != 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_web_preview)
        run: node recruitment/github-state.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 同步自域详情并核验公开数据
        id: web
        if: env.DRY_RUN != 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_web_preview)
        run: node recruitment/publish-web.mjs
        env:
          RECRUITMENT_PUBLIC_BASE_URL: ${{ vars.RECRUITMENT_PUBLIC_BASE_URL }}
          RECRUITMENT_SITE_SYNC_TOKEN: ${{ secrets.RECRUITMENT_SITE_SYNC_TOKEN }}
      - name: 发送微信招聘简报
        id: send
        if: env.DRY_RUN != 'true'
        run: node recruitment/run.mjs --send-only
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
          RECRUITMENT_REPORT_URL: ${{ steps.web.outputs.report_url }}
      - name: 保存逐接收人发送状态
        if: always() && steps.publish.outcome == 'success'
        run: node recruitment/github-state.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 保留日报与来源诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-recruitment-${{ github.run_id }}
          path: .recruitment-state/reports/
          if-no-files-found: ignore
          retention-days: 30

  server-diagnostic:
    # This job deliberately has NO WeChat/sync Secrets, write token, or state publishing.
    if: >-
      vars.RECRUITMENT_SENDER_OWNER == 'server' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.test_wechat && !inputs.daily_preview && !inputs.publish_web_preview))
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      NODE_USE_ENV_PROXY: '1'
      RECRUITMENT_STATE_DIR: ${{ github.workspace }}/.recruitment-state
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recruitment/package-lock.json
      - run: npm ci --prefix recruitment --no-audit --no-fund
      - run: npm test --prefix recruitment
      - name: 无密钥只读诊断，不改动服务器网页及发送记录
        run: node recruitment/run.mjs --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-owner-diagnostic-${{ github.run_id }}
          path: .recruitment-state/reports/
          if-no-files-found: ignore
          retention-days: 7

  test-wechat:
    if: vars.RECRUITMENT_SENDER_OWNER != 'server' && github.event_name == 'workflow_dispatch' && (inputs.test_wechat || inputs.daily_preview)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      NODE_USE_ENV_PROXY: '1'
      RECRUITMENT_STATE_DIR: ${{ github.workspace }}/.recruitment-state
    steps:
      - name: 检查手动发送模式互斥
        env:
          TEMPLATE_TEST: ${{ inputs.test_wechat }}
          DAILY_PREVIEW: ${{ inputs.daily_preview }}
          WEB_ONLY: ${{ inputs.publish_web_preview }}
        run: |
          if [ "$WEB_ONLY" = true ]; then
            echo '::error::仅网页预览不能同时选择任何微信发送模式。'
            exit 1
          fi
          if [ "$TEMPLATE_TEST" = true ] && [ "$DAILY_PREVIEW" = true ]; then
            echo '::error::占位模板测试与日常日报预览不能同时选择。'
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recruitment/package-lock.json
      - name: 安装招聘模块依赖
        run: npm ci --prefix recruitment --no-audit --no-fund
      - name: 验证招聘逻辑
        run: npm test --prefix recruitment
      - name: 校验微信服务器保存的招聘模板
        run: node recruitment/check-wechat.mjs
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
      - name: 恢复报告与去重记录
        run: node recruitment/github-state.mjs restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 生成真实采集预览
        run: node recruitment/run.mjs --dry-run
      - name: 发布采集报告详情
        run: node recruitment/github-state.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 同步自域详情并核验公开数据
        id: web
        run: node recruitment/publish-web.mjs
        env:
          RECRUITMENT_PUBLIC_BASE_URL: ${{ vars.RECRUITMENT_PUBLIC_BASE_URL }}
          RECRUITMENT_SITE_SYNC_TOKEN: ${{ secrets.RECRUITMENT_SITE_SYNC_TOKEN }}
      - name: 发送明确标注的模板测试消息
        if: inputs.test_wechat && !inputs.daily_preview
        run: node recruitment/check-wechat.mjs --send-test
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
          RECRUITMENT_REPORT_URL: ${{ steps.web.outputs.report_url }}
      - name: 发送日常样式的真实采集日报
        if: inputs.daily_preview
        run: node recruitment/check-wechat.mjs --send-daily-preview
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
          RECRUITMENT_REPORT_URL: ${{ steps.web.outputs.report_url }}
      - name: 保留手动预览采集报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-manual-preview-${{ github.run_id }}
          path: .recruitment-state/reports/
          if-no-files-found: ignore
          retention-days: 30
