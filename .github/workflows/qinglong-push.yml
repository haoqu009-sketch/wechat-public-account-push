name: medical-imaging-recruitment

on:
  push:
    paths:
      - 'recruitment/**'
      - '.github/workflows/qinglong-push.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅采集并生成报告，不发送微信、不改变去重状态'
        type: boolean
        default: true
  schedule:
    # 每天北京时间 07:30；GitHub Actions 定时任务可能延迟。
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: medical-imaging-recruitment
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      NODE_USE_ENV_PROXY: '1'
      RECRUITMENT_STATE_DIR: ${{ github.workspace }}/.recruitment-state
      # 代码部署自动跑预览；仅定时运行或手动取消dry_run时发送。
      DRY_RUN: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.dry_run) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recruitment/package-lock.json
      - name: 安装招聘模块依赖
        run: npm ci --prefix recruitment --no-audit --no-fund
      - name: 验证招聘逻辑
        run: npm test --prefix recruitment
      - name: 恢复持久化去重状态
        run: node recruitment/github-state.mjs restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 采集并生成日报
        run: |
          if [ "$DRY_RUN" = true ]; then
            node recruitment/run.mjs --dry-run
          else
            node recruitment/run.mjs --collect-only
          fi
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
      - name: 发布日报详情
        id: publish
        if: env.DRY_RUN != 'true'
        run: node recruitment/github-state.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 发送微信招聘简报
        id: send
        if: env.DRY_RUN != 'true'
        run: node recruitment/run.mjs --send-only
        env:
          ALL_CONFIG: ${{ secrets.ALL_CONFIG }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          ADDITIONAL_USER_OPENIDS: ${{ secrets.ADDITIONAL_USER_OPENIDS }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          RECRUITMENT_TEMPLATE_ID: ${{ secrets.RECRUITMENT_TEMPLATE_ID }}
          RECRUITMENT_REPORT_URL: https://github.com/${{ github.repository }}/blob/recruitment-state/reports/latest.md
      - name: 保存逐接收人发送状态
        if: always() && steps.publish.outcome == 'success'
        run: node recruitment/github-state.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 保留日报与来源诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-recruitment-${{ github.run_id }}
          path: .recruitment-state/reports/
          if-no-files-found: ignore
          retention-days: 30
